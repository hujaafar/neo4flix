name: neo4flix
x-api: &api
  restart: unless-stopped
  init: true
  mem_limit: 512m
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: [CMD, java, -Xmx32m, -cp, /app/health, io.neo4flix.common.Healthcheck]
    interval: 15s
    timeout: 6s
    retries: 10
    start_period: 20s
  networks: [backend]
  depends_on:
    neo4j: { condition: service_healthy }
  environment: &env
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Run setup first}
    APP_ORIGIN: ${APP_ORIGIN:-https://localhost:8443}
  volumes:
    - ./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
services:
  test-stress:
    image: python:3.13-alpine
    profiles: [test]
    working_dir: /app
    command:
      [
        python,
        tests/stress.py,
        --base,
        '${APP_ORIGIN:-https://localhost:8443}',
        --ca,
        secrets/local-ca.crt,
        --connect,
        gateway:443,
        --out,
        test-results/stress-results.json,
      ]
    networks: [edge]
    volumes:
      - ./tests:/app/tests:ro
      - ./secrets/local-ca.crt:/app/secrets/local-ca.crt:ro
      - ./test-results:/app/test-results
  test-api:
    image: python:3.13-alpine
    profiles: [test]
    working_dir: /app
    command:
      [
        python,
        tests/integration.py,
        --base,
        '${APP_ORIGIN:-https://localhost:8443}',
        --ca,
        secrets/local-ca.crt,
        --connect,
        gateway:443,
      ]
    networks: [edge]
    volumes:
      - ./tests:/app/tests:ro
      - ./.env:/app/.env:ro
      - ./secrets/local-ca.crt:/app/secrets/local-ca.crt:ro
      - ./test-results:/app/test-results
  neo4j:
    build: ./infra/neo4j
    restart: unless-stopped
    mem_limit: 1800m
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run setup first}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_http_enabled: 'false'
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    volumes: [graph-data:/data, graph-logs:/logs]
    networks: [backend]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN gds.version(), gds.similarity.jaccard([1,2],[2,3])" > /dev/null 2>&1',
        ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
  movie-service:
    <<: *api
    build: { context: ., args: { SERVICE: movie-service } }
  user-service:
    <<: *api
    # OAuth token and signing-key requests need outbound HTTPS; no service port is published.
    networks: [backend, oauth]
    build: { context: ., args: { SERVICE: user-service } }
    environment:
      <<: *env
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run setup first}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError ${OAUTH_JAVA_OPTIONS:-}'
    volumes:
      - ./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - ./secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ./secrets/oauth:/run/oauth:ro
  rating-service:
    <<: *api
    build: { context: ., args: { SERVICE: rating-service } }
  recommendation-service:
    <<: *api
    build: { context: ., args: { SERVICE: recommendation-service } }
  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [backend, edge]
    depends_on:
      movie-service: { condition: service_healthy }
      user-service: { condition: service_healthy }
      rating-service: { condition: service_healthy }
      recommendation-service: { condition: service_healthy }
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:${HTTPS_PORT:-8443}:443', '127.0.0.1:${HTTP_PORT:-8080}:80']
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    volumes: [./infra/Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config]
    networks: [edge]
    depends_on: [frontend]
volumes:
  graph-data:
  graph-logs:
  caddy-data:
  caddy-config:
networks:
  backend: { internal: true }
  edge:
  oauth:
