# Caddy overwrites forwarded client headers; this container has no published ports.
map $http_x_forwarded_for $client_limit_key { default $http_x_forwarded_for; "" $binary_remote_addr; }
limit_req_zone $client_limit_key zone=auth_limit:10m rate=30r/m;
resolver 127.0.0.11 valid=10s ipv6=off;
upstream users { zone users 64k; server user-service:8082 resolve; }
upstream movies { zone movies 64k; server movie-service:8081 resolve; }
upstream ratings { zone ratings 64k; server rating-service:8083 resolve; }
upstream recommendations { zone recommendations 64k; server recommendation-service:8084 resolve; }
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Public availability reads must not consume the credential-attempt allowance.
    location = /api/auth/oauth2/providers {
        access_log off;
        proxy_pass http://users;
        add_header Cache-Control "no-store" always;
    }
    location /api/auth/ {
        # OAuth callbacks contain short-lived authorization codes and state in the URL.
        access_log off;
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://users;
        add_header Cache-Control "no-store" always;
    }
    location /api/users/ { proxy_pass http://users; }
    location /api/movies { proxy_pass http://movies; }
    location /api/ratings { proxy_pass http://ratings; }
    location /api/recommendations { proxy_pass http://recommendations; }
    location /api/ { return 404; }
    location /art/ { try_files $uri =404; expires 1d; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
