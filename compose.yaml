name: neo4flix
x-api: &api
  restart: unless-stopped
  init: true
  mem_limit: 512m
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: [CMD, java, -Xmx32m, -cp, /app/health, io.neo4flix.common.Healthcheck]
    interval: 15s
    timeout: 6s
    retries: 10
    start_period: 20s
  networks: [backend]
  depends_on:
    neo4j: { condition: service_healthy }
  environment: &env
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Run setup first}
    APP_ORIGIN: ${APP_ORIGIN:-https://localhost:8443}
  volumes:
    - ./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
services:
  test-api:
    image: python:3.13-alpine
    profiles: [test]
    working_dir: /app
    command: [python, tests/integration.py, --ca, secrets/local-ca.crt, --connect, gateway:443]
    networks: [edge]
    volumes:
      - ./tests:/app/tests:ro
      - ./.env:/app/.env:ro
      - ./secrets/local-ca.crt:/app/secrets/local-ca.crt:ro
      - ./test-results:/app/test-results
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    mem_limit: 1800m
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run setup first}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_http_enabled: 'false'
    volumes: [graph-data:/data, graph-logs:/logs]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1" > /dev/null 2>&1']
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
  movie-service:
    <<: *api
    build: { context: ., args: { SERVICE: movie-service } }
  user-service:
    <<: *api
    build: { context: ., args: { SERVICE: user-service } }
    environment:
      <<: *env
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run setup first}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - ./secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
  rating-service:
    <<: *api
    build: { context: ., args: { SERVICE: rating-service } }
  recommendation-service:
    <<: *api
    build: { context: ., args: { SERVICE: recommendation-service } }
  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [backend, edge]
    depends_on:
      movie-service: { condition: service_healthy }
      user-service: { condition: service_healthy }
      rating-service: { condition: service_healthy }
      recommendation-service: { condition: service_healthy }
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:8443:443', '127.0.0.1:8080:80']
    volumes: [./infra/Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config]
    networks: [edge]
    depends_on: [frontend]
volumes:
  graph-data:
  graph-logs:
  caddy-data:
  caddy-config:
networks:
  backend: { internal: true }
  edge:
